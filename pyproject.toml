[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-pipeline"
version = "0.1.0"
description = "Async multi-agent deep-research pipeline: DAG execution, SSE streaming, checkpointing, and an LLM-as-a-Judge grounding eval."

requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.6"]          # exact token counts (falls back to a heuristic without it)
ddg = ["ddgs>=9.0"]                  # free DuckDuckGo search backend
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
research-server = "research_pipeline.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"eval/*" = ["ASYNC240"]  # one-off CLI scripts; trivial file I/O
